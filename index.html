<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Memory Numbers</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game">
      <h1>
  Atminties žaidimas
  <span id="myRank"></span>
</h1>

      <p>Lygis: <span id="level">4</span></p>

      <div id="numberBox" class="number-box"></div>

      <input
        id="answerInput"
        type="text"
        placeholder="Įrašyk skaičius"
        autocomplete="off"
      />

      <button id="checkBtn">Tikrinti</button>

      <p id="message"></p>

      <div><p>TOP 10:</p></div>
      <div id="top10"></div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
