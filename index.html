  <!-- Mobile / UX -->
  <meta name="theme-color" content="#f75c09" />

  <link rel="icon" type="image/png" href="/favicon-96x96.png?v=20260529" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260529" />

  <link rel="stylesheet" href="style.css" />

<body>
  <div id="background">
    <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
      <circle class="bubble b1" cx="200" cy="300" r="80" />
      <circle class="bubble b2" cx="700" cy="500" r="120" />
      <circle class="bubble b3" cx="500" cy="300" r="60" />
      <circle class="bubble b4" cx="350" cy="600" r="90" />
    </svg>
  </div>

  <div id="nicknameScreen">
    <input id="nicknameInput" maxlength="12" placeholder="Vardas" />
    <button id="saveNameBtn">Eiti į žaidimą</button>
  </div>

  <div id="gameScreen" style="display: none">
    <div class="menu">

      <a class="menu-item" href="myStatistics.html">Mano statistika</a>

      <a class="menu-item" href="top10.html">TOP 10</a>

      <a class="menu-item" href="statistics.html">Bendra statistika</a>

    </div>

    <div id="gameStartedScreen">
      <h1>
        Atminties žaidimas
        <span id="myRank"></span>
      </h1>

      <canvas id="timeCanvas"></canvas>

      <p>Lygis: <span id="level"></span></p>

      <div id="numberBox" class="number-box"></div>

      <input id="answerInput" type="text" placeholder="Įrašyki skaičius" autocomplete="off"
        style="border-radius: 10px" />

      <button id="checkBtn" class="btnStyle">PRADĖTI</button>

      <p style="height: 2rem" id="message1"></p>
      <p style="height: 2rem" id="message2"></p>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>

</html>
