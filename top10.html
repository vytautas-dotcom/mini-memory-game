<!doctype html>
<html lang="lt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TOP 10</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      margin: 0;
      padding: 40px 1rem;
      background: #f3f5f9;
      font-family: Calibri, 'Trebuchet MS', sans-serif;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: center;
    }

    .stats-card {
      width: 700px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .title h1 {
      margin: 0;
      font-size: 32px;
    }

    .nickname {
      color: #666;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="stats-card">

    <div class="title">
      <a class="link-style" href="/">Atgal</a>
      <h1>Top 10</h1>
      <div class="nickname" id="nickname">
      </div>
    </div>

    <div id="top10"></div>
  </div>

  <script type="module" src="top10.js"></script>
</body>

</html>
