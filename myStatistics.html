<!doctype html>
<html lang="lt">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Stats</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 40px 0;
      padding: 40px 1rem;
      background: #f3f5f9;
      font-family: Calibri, 'Trebuchet MS', sans-serif;
      letter-spacing: 0.5px;

      display: flex;
      justify-content: center;
    }

    .stats-card {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
      width: 700px;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .top-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
    }

    .link-style {
      text-decoration: none;

      text-align: center;
      font-size: 18px;
      letter-spacing: 0.5px;
      color: rgb(70, 72, 121);

      background: white;
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
      width: auto;
      box-sizing: border-box;
      cursor: pointer;
    }

    .nickname {
      color: #666;
      font-size: 20px;
    }

    .title-h1 {
      margin: 0;
      font-size: 32px;
      text-align: center;
    }

    .stats-block {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
      margin-bottom: 30px;
    }

    .stat-box {
      background: #dce7f879;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }

    .stat-label {
      color: #777;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .stat-value {
      font-size: 38px;
      font-weight: bold;
    }

    .chart-container {
      background: #fafafa;
      border-radius: 20px;
      padding: 20px;
    }

    canvas {
      width: 100% !important;
      height: 350px !important;
    }
  </style>
</head>

<body>

  <div class="stats-card">

    <div class="top-wrapper">
      <a class="link-style" href="/">
        Atgal
      </a>

      <div class="nickname" id="nickname">
      </div>
    </div>

    <h1 class="title-h1">Asmeninė statistika</h1>

    <div class="stats-block">

      <div class="stat-box">
        <div class="stat-label">Pirmas rezultatas</div>
        <div class="stat-label" id="startDate"></div>
        <div class="stat-label" id="startHour"></div>
        <div class="stat-value" id="startResult">
        </div>
      </div>

      <div class="stat-box">
        <div class="stat-label">Paskutinis rezultatas</div>
        <div class="stat-label" id="lastDate"></div>
        <div class="stat-label" id="lastHour"></div>
        <div class="stat-value" id="lastResult">
        </div>
      </div>

      <div class="stat-box">
        <div class="stat-label">Asmeninis rekordas</div>
        <div class="stat-label" id="bestDate">00-00-00</div>
        <div class="stat-label" id="bestHour">00:00</div>
        <div class="stat-value" id="bestResult">
        </div>
      </div>

    </div>

  </div>

  <script type="module" src="myStatistics.js"></script>
</body>

</html>
