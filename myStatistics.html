<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Player Stats</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body{
      margin:0;
      padding:40px;
      background:#f3f5f9;
      font-family:Arial;
      display:flex;
      justify-content:center;
    }

    .stats-card{
      width:700px;
      background:white;
      border-radius:20px;
      padding:30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:30px;
    }

    .title h1{
      margin:0;
      font-size:32px;
    }

    .nickname{
      color:#666;
      font-size:20px;
    }

    .stats-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
      margin-bottom:30px;
    }

    .stat-box{
      background:#f7f9fc;
      border-radius:16px;
      padding:20px;
      text-align:center;
    }

    .stat-label{
      color:#777;
      margin-bottom:10px;
      font-size:15px;
    }

    .stat-value{
      font-size:38px;
      font-weight:bold;
    }

    .chart-container{
      background:#fafafa;
      border-radius:20px;
      padding:20px;
    }

    canvas{
      width:100% !important;
      height:350px !important;
    }
  </style>
  </head>
  <body>

      <div class="stats-card">

    <div class="title">
        <a href="/">Atgal</a>
      <h1>Asmeninė statistika</h1>
      <div class="nickname" id="nickname">
      </div>
    </div>

    <div class="stats-grid">

      <div class="stat-box">
        <div class="stat-label">Pirmas rezultatas</div>
        <div class="stat-value" id="startResult">
        </div>
      </div>

      <div class="stat-box">
        <div class="stat-label">Paskutinis rezultatas</div>
        <div class="stat-value" id="lastResult">
        </div>
      </div>

      <div class="stat-box">
        <div class="stat-label">Rekordas</div>
        <div class="stat-value" id="bestResult">
        </div>
      </div>

    </div>

  </div>

    <script type="module" src="myStatistics.js"></script>
  </body>
</html>
